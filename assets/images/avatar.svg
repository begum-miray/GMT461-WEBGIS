  <circle cx="100" cy="72" r="28" fill="#f8fafc"/>
  <!-- Hair / Accents -->
  <path d="M72 70 C72 45 128 45 128 70 C120 54 80 54 72 70 Z" fill="#334155"/>
  <!-- Shoulders & Torso -->
