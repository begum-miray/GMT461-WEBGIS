  <!-- Lanyard / GIS Badge -->
  <path d="M92 106 L95 128 L105 128 L108 106" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <rect x="92" y="128" width="16" height="22" rx="3" fill="#ffffff"/>
  <rect x="94" y="131" width="12" height="4" fill="#0284c7"/>
  
  <!-- Geomatics / Satellite Ring Orbit -->
  <ellipse cx="100" cy="100" rx="84" ry="32" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-25 100 100)" opacity="0.6"/>
  <circle cx="165" cy="65" r="5" fill="#10b981"/>
  <circle cx="35" cy="135" r="4" fill="#f59e0b"/>
