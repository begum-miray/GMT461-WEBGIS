  </defs>
  <!-- Background circle with neon border -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#haloGrad)" stroke-width="4" stroke-dasharray="8 4"/>
  
  <!-- Stylized Person / Student Silhouette -->
